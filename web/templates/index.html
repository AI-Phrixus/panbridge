<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PanBridge</title>
  <link rel="stylesheet" href="/static/style.css?v=0.5.4-ui1" />
  <script src="/static/ui.js?v=0.5.4-ui1" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Pan<span>Bridge</span> <span class="muted" style="font-size:.75rem;font-weight:500" id="appver">Google Drive · 可選檔與暫停</span></div>
      <nav>
        <a href="/">任務</a>
        <a href="/settings">帳號設定</a>
        <a href="#" id="logout">登出</a>
      </nav>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <section id="action-confirm" class="inline-confirm" tabindex="-1" aria-labelledby="confirm-message" hidden>
      <p id="confirm-message"></p>
      <div class="actions"><button id="confirm-yes" type="button">確認</button><button id="confirm-no" class="secondary" type="button">返回</button></div>
    </section>
    <div class="card" id="sysbar" style="padding:12px 20px">
      <span class="muted" id="sysinfo">載入系統狀態…</span>
    </div>

    <div class="card">
      <h2>貼上分享連結</h2>
      <p class="muted">支援夸克 pan.quark.cn 與百度 pan.baidu.com。可多行批量。提取碼可寫在連結後 <code>?pwd=xxxx</code> 或下方欄位。</p>
      <label>分享連結</label>
      <textarea id="links" placeholder="https://pan.quark.cn/s/xxxx&#10;https://pan.baidu.com/s/xxxx 提取码: abcd"></textarea>
      <div class="row">
        <div>
          <label>統一提取碼（可選）</label>
          <input id="pwd" placeholder="若連結內已有可留空" />
        </div>
        <div>
          <label>雲端目標路徑前綴</label>
          <input id="path" placeholder="/PanBridge" value="/PanBridge" />
        </div>
      </div>
      <label>存放目標（大文件必看）</label>
      <select id="dest">
        <option value="google" selected>Google Drive（使用已授權的 Google One 空間）</option>
        <option value="auto">自動：已連接 Google Drive 優先／其他可用目標</option>
        <option value="pcloud">強制：pCloud（免費空間小，大文件會失敗）</option>
        <option value="local">強制：服務器暫存（僅自己下載，注意條款與磁盤）</option>
      </select>
      <p class="muted" style="margin-top:8px">Google One 空間透過 Google Drive 使用。目標未連接時不會偷偷改存其他網盤。</p>
      <label><input type="checkbox" id="select-files" checked /> 先列出文件讓我選擇，再開始下載</label>
      <div class="actions">
        <button id="submit">建立選檔任務</button>
      </div>
      <p id="createMsg" class="muted"></p>
    </div>

    <div class="card">
      <h2>任務列表</h2>
      <p id="jobsMeta" class="muted" style="margin-top:0"></p>
      <p id="refresh-status" class="muted" role="status"></p>
      <button class="secondary" onclick="jobsPoll.refresh()">立即刷新</button>
      <div class="table-scroll"><table>
        <thead>
          <tr><th>ID</th><th>來源</th><th>標題 / 連結</th><th>狀態</th><th>進度</th><th></th></tr>
        </thead>
        <tbody id="jobs"></tbody>
      </table></div>
    </div>
  </div>
  <script type="module">
    const $ = s => document.querySelector(s);
    let epoch=0;
    const activeControls=new Set();

    function fmtSpeed(bps) {
      bps = Number(bps) || 0;
      if (bps <= 0) return '';
      if (bps < 1024) return bps.toFixed(0) + ' B/s';
      if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
      return (bps / 1048576).toFixed(2) + ' MB/s';
    }

    function badge(s) {
      return PB.badge(s);
    }

    function bar(p) {
      p = PB.progress(p);
      return '<div class="progress" role="progressbar" aria-label="搬運進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'" title="' + p + '%"><i style="width:' + p + '%"></i></div>';
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadSys() {
        const s = await PB.request('/api/tasks/system/status');
        const p = s.providers || {};
        const ok = x => (x ? '✓' : '✗');
        const el = $('#sysinfo');
        if (el) {
          const pc = (s.pcloud_free_gb != null)
            ? (' · pCloud <b>' + esc(s.pcloud_free_gb) + 'G</b>')
            : '';
          el.innerHTML =
            'v' + esc(s.version || '?') + ' · UI 1'+
            ' · 磁盤 <b>' + esc(s.disk_free_gb ?? '?') + 'G</b>' +
            pc +
            ' · 併發 ' + esc(s.max_concurrent_jobs ?? '?') +
            ' · 帳號 Google' + ok(p.google) +
            ' PC' + ok(p.pcloud) +
            ' 夸克' + ok(p.quark) +
            ' 百度' + ok(p.baidu);
          const ver = document.getElementById('appver');
          if (ver) ver.textContent = 'v' + (s.version || '')+' · UI 1';
        }
    }

    async function loadJobs() {
        if(activeControls.size)return;
        const revision=epoch;
        const data = await PB.request('/api/tasks');
        if(revision!==epoch)return;
        const jobs = data.jobs || [];
        const meta = $('#jobsMeta');
        const count=s=>jobs.filter(j=>j.status===s).length;
        if (meta) meta.textContent = '共 '+jobs.length+' 個任務 · 正在搬運 '+(count('downloading')+count('uploading'))+' · 等待選檔 '+count('awaiting_selection')+' · 已暫停 '+count('paused')+' · 需要處理 '+count('failed');
        const tb = $('#jobs');
        if (!jobs.length) {
          PB.render(tb,'<tr><td colspan="6" class="muted">尚無任務</td></tr>');
          return;
        }
        PB.render(tb,jobs.map(j => {
          const retiredTarget = j.destination === 'onedrive';
          const spd = fmtSpeed(j.speed_bps);
          const prog = PB.progress(j.progress);
          // status_detail already includes speed when downloading; only append if missing
          const hasSpd = /B\/s|KB\/s|MB\/s/.test(j.status_detail || '');
          const detail = !retiredTarget && j.status_detail
            ? '<div class="muted" style="font-size:.85rem">' + esc(j.status_detail) +
              (spd && !hasSpd ? ' · ' + esc(spd) : '') + '</div>'
            : (spd ? '<div class="muted" style="font-size:.85rem">' + esc(spd) + '</div>' : '');
          const err = retiredTarget ? '<div class="muted">舊目標已停用；可進入任務重新搬運到 Google Drive。</div>' : j.error_message
            ? '<div class="err">' + esc(j.error_message) + '</div>'
            : '';
          let actions = '';
          if (j.status === 'failed' && !retiredTarget) {
            actions += '<button class="secondary" onclick="retry(' + j.id + ')">重試</button> ';
          }
          if (!retiredTarget && (j.status === 'done' || j.progress > 0)) {
            actions += '<button class="secondary" onclick="openJobFolder(' + j.id + ')">雲端位置</button> ';
          }
          if (['queued','resolving','saving','downloading','uploading'].includes(j.status)) {
            actions += '<button class="secondary" onclick="control(' + j.id + ',\'pause\')">暫停</button> ';
            actions += '<button class="secondary danger" onclick="cancel(' + j.id + ')">取消</button>';
          }
          if (j.status === 'paused') actions += '<button onclick="control(' + j.id + ',\'resume\')">繼續</button> ';
          if (j.status === 'awaiting_selection') actions += '<a class="btn" href="/tasks/' + j.id + '">選擇文件</a> ';
          actions += '<button class="secondary danger" onclick="control(' + j.id + ',\'delete\')">刪除任務</button>';
          return (
            '<tr>' +
            '<td><a href="/tasks/' + j.id + '">#' + j.id + '</a></td>' +
            '<td>' + esc(j.source_type) + (j.destination ? '<div class="muted" style="font-size:.75rem">' + esc(retiredTarget ? '舊目標（已停用）' : j.destination) + '</div>' : '') + '</td>' +
            '<td><div>' + esc(j.title || '') + '</div>' +
            '<div class="muted" style="word-break:break-all;font-size:.8rem">' + esc(j.share_url) + '</div>' +
            detail + err + '</td>' +
            '<td>' + badge(j.status) + '</td>' +
            '<td>' + bar(prog) + ' <span class="muted">' + prog.toFixed(1) + '%</span></td>' +
            '<td>' + actions + '</td>' +
            '</tr>'
          );
        }).join(''));
    }

    window.retry = async function (id) {
      await control(id, 'retry');
    };
    window.control = async function(id, action) {
      if(action==='delete'&&!await PB.confirmAction('移除任務 #'+id+' 並停止搬運？Google Drive 文件不刪除，未完成暫存先保留。','確認刪除任務'))return;
      if(action==='cancel'&&!await PB.confirmAction('取消任務 #'+id+'？已完成的雲端文件保留，未完成的搬運會停止。','確認取消搬運'))return;
      await PB.once('job:'+id,async()=>{
        activeControls.add(id);epoch++;
        $('#jobs').querySelectorAll('button').forEach(el=>el.disabled=true);
        try{await PB.request('/api/tasks/'+id+(action==='delete'?'':'/'+action),{method:action==='delete'?'DELETE':'POST'});PB.notice('任務 #'+id+'：'+({pause:'已暫停',resume:'已接續',retry:'已排隊重試',cancel:'已取消',delete:'已移除記錄'}[action]||'操作完成')+'。','success');}
        catch(e){PB.notice(e.message,'error');}
        finally{activeControls.delete(id);epoch++;$('#jobs').querySelectorAll('button').forEach(el=>el.disabled=false);await jobsPoll.refresh();}
      });
    };
    window.openJobFolder = async function (id) {
      try {
        const d = await PB.request('/api/tasks/' + id + '/location');
        const url = d.url || d.folder_url;
        if(!url){PB.notice('雲端資料夾尚未建立。');return;}
        const target=new URL(url,location.origin);
        if(target.protocol!=='https:'&&target.origin!==location.origin){PB.notice('雲端位置不是安全網址。','error');return;}
        PB.notice('任務 #'+id+' 的雲端位置已取得。');const link=document.createElement('a');link.href=target.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='開啟雲端位置';link.className='btn secondary';$('#notice').append(' ',link);
      } catch (e) { PB.notice(e.message,'error'); }
    };
    window.cancel = async function (id) {
      await control(id, 'cancel');
    };

    $('#logout').onclick = async function (e) {
      e.preventDefault();
      try{await PB.request('/api/auth/logout', {method:'POST'});location.href='/login';}catch(error){PB.notice(error.message,'error');}
    };

    $('#submit').onclick = async function () {
      const text = $('#links').value.trim();
      if (!text) return;
      const selectionRequested=$('#select-files').checked;
      await PB.once('create',async()=>{
      $('#submit').disabled=true;
      $('#createMsg').textContent = '提交中…';
      try{const data = await PB.request('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text,
          passcode: $('#pwd').value,
          pcloud_path: $('#path').value,
          destination: ($('#dest') && $('#dest').value) || 'google',
          select_files: selectionRequested
        })
      });
      if(!Array.isArray(data.job_ids)||!data.job_ids.length)throw new Error('尚未確認任務編號，請刷新查看，不要連續提交。');
      $('#createMsg').textContent = '已建立任務：'+data.job_ids.join(', ')+(selectionRequested?'；請在任務中選檔後開始搬運。':'；已排隊搬運。');
      if($('#links').value.trim()===text)$('#links').value = '';
      epoch++;await jobsPoll.refresh();
      }catch(error){$('#createMsg').textContent=error.message;}
      finally{$('#submit').disabled=false;}
      });
    };

    $('#select-files').onchange=()=>{$('#submit').textContent=$('#select-files').checked?'建立選檔任務':'開始後台搬運';};
    const jobsPoll=PB.poll(loadJobs,{interval:3000,onSuccess:()=>{$('#refresh-status').textContent='已更新 · '+new Date().toLocaleTimeString()+' · 背景頁面暫停刷新';},onError:e=>{$('#refresh-status').textContent=e.message;}});
    PB.poll(loadSys,{interval:20000,onError:()=>{$('#sysinfo').textContent='系統狀態暫時無法更新，搬運不依賴此頁面。';}});
    window.jobsPoll=jobsPoll;
  </script>
</body>
</html>
