<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任務 · PanBridge</title>
  <link rel="stylesheet" href="/static/style.css?v=0.5.5-ui3.1" />
  <script src="/static/ui.js?v=0.5.5-ui3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <div class="wrap">
    <header>
      <div class="logo">Pan<span>Bridge</span> <small class="ui-version">選檔 · 暫停 · 雲端搬運 · UI 3</small></div>
      <nav aria-label="主要導覽">
        <a href="/">← 任務列表</a>
        <a href="/settings">帳號設定</a>
      </nav>
    </header>
    <main id="main">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <section id="action-confirm" class="inline-confirm" tabindex="-1" aria-labelledby="confirm-message" hidden>
      <p id="confirm-message"></p>
      <div class="actions"><button id="confirm-yes" type="button">確認</button><button id="confirm-no" class="secondary" type="button">返回</button></div>
    </section>
    <div class="card">
      <h1 id="task-heading">任務明細</h1>
      <p id="task-title" class="muted"></p>
      <div id="meta" class="muted"></div>
      <div class="actions" id="jobActions"></div>
      <section id="google-copy-confirm" hidden aria-label="重新搬運確認">
        <p>保留原任務，建立或開啟 Google Drive 任務。只會先列出文件，等你選檔後才開始下載。</p>
        <button type="button" id="google-copy-submit" onclick="copyToGoogle()">確認建立選檔任務</button>
        <button type="button" class="secondary" onclick="document.getElementById('google-copy-confirm').hidden=true">返回</button>
      </section>
      <div id="err" class="err"></div>
      <p id="refresh-status" class="muted" role="status"></p>
      <button class="secondary" type="button" onclick="jobPoll.refresh()">立即刷新</button>
    </div>
    <div class="card" id="task-files">
      <h2>檔案</h2>
      <p class="muted">Google Drive 私人文件：Infuse 請在「新增檔案 → 新增共享」連接 Google Drive；Windows／Mac 的 VLC 可開啟 Google Drive 電腦版中的串流文件。不要把私人文件改為公開分享。Oracle 不轉送已交付的影片。</p>
      <div id="selection" hidden>
        <p>勾選想要下載的文件，未選文件不會下載。</p>
        <div class="actions"><button class="secondary" onclick="selectVisible(true)">選取全部搜尋結果</button><button class="secondary" onclick="selectVisible(false)">取消全部搜尋結果</button><button id="start-selection" onclick="confirmSelection()">確認並開始搬運</button></div>
        <p id="selection-summary" class="muted"></p>
      </div>
      <p id="file-summary" class="muted"></p>
      <div class="row file-tools">
        <input id="filter-files" aria-label="搜尋文件名稱或資料夾" placeholder="搜尋文件名稱或資料夾" oninput="filterFiles()" />
        <select id="filter-status" aria-label="篩選文件狀態" onchange="filterFiles()"><option value="">全部狀態</option><option value="failed">需要處理</option><option value="done">已完成</option><option value="active">正在搬運</option><option value="queued">等待搬運</option></select>
      </div>
      <div class="pagination"><button id="previous-page" class="secondary" onclick="changePage(-1)">上一頁</button><span id="page-status" class="muted" role="status"></span><button id="next-page" class="secondary" onclick="changePage(1)">下一頁</button></div>
      <div class="table-scroll"><table>
        <thead>
          <tr><th>路徑</th><th>大小</th><th>下載</th><th>上傳</th><th>狀態</th><th>操作</th></tr>
        </thead>
        <tbody id="files"></tbody>
      </table></div>
    </div>
    </main>
  </div>
  <script type="module">
    const jobId = {{ job_id }};
    const selectedIds = new Set();
    let currentFiles = [];
    let currentStatus = '';
    let currentDest = '';
    let page = 1;
    const pageSize = 100;
    let acting = false;
    let epoch = 0;
    let taskView;
    let taskIndexReady=false;
    function fmt(n){
      n = Number(n)||0;
      if (n < 1024) return n+' B';
      if (n < 1048576) return (n/1024).toFixed(1)+' KB';
      if (n < 1073741824) return (n/1048576).toFixed(1)+' MB';
      return (n/1073741824).toFixed(2)+' GB';
    }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    async function openLocation(jobId, fileId){
      try {
        const d = await PB.request('/api/tasks/'+jobId+'/files/'+fileId+'/location');
        const url = d.url || d.folder_url;
        if (!url) { PB.notice('尚無雲端位置（可能還未上傳完成）','error'); return; }
        showLocation(url);
      } catch (e) { PB.notice(e.message,'error'); }
    }
    async function openJobFolder(){
      try {
        const d = await PB.request('/api/tasks/'+jobId+'/location');
        const url = d.url || d.folder_url;
        if (url) showLocation(url);
        else PB.notice('資料夾尚未建立。','info');
      } catch (e) { PB.notice(e.message,'error'); }
    }
    function showLocation(url){
      const target = new URL(url,location.origin);
      if(target.protocol!=='https:' && target.origin!==location.origin){PB.notice('雲端位置不是安全網址。','error');return;}
      // Use a user-clicked link: async window.open is blocked by many browsers.
      PB.notice('雲端位置已取得，請按下方連結。');
      const link=document.createElement('a');link.href=target.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='開啟雲端位置';link.className='btn secondary';
      document.getElementById('notice').append(' ',link);
    }
    async function load(){
      if(acting)return;
      const revision=epoch;
      if(!taskView)taskView=await PB.loadTaskView();
      if(!taskIndexReady){
        const listing=await PB.request('/api/tasks');
        if(revision!==epoch)return;
        const shown=PB.taskRows(listing.jobs,taskView.firstJobId).find(j=>j.id===jobId);
        if(!shown){
          document.getElementById('task-heading').textContent='舊項目記錄';
          document.getElementById('task-files').hidden=true;
          PB.notice('這份記錄不在目前的新項目列表中。歷史校驗資料仍保留，請返回任務列表。');
          return;
        }
        document.getElementById('task-heading').textContent='任務 #'+shown.displayNumber;
        taskIndexReady=true;
      }
      const {job, files} = await PB.request('/api/tasks/'+jobId);
      if(revision!==epoch)return;
      document.getElementById('task-title').textContent=job.title||'';
      currentStatus = job.status; currentFiles = files || [];
      const known=new Set(currentFiles.map(f=>f.id));for(const id of selectedIds)if(!known.has(id))selectedIds.delete(id);
      document.getElementById('selection').hidden = job.status !== 'awaiting_selection';
      const spd = (function(bps){bps=Number(bps)||0; if(bps<=0)return ''; if(bps<1048576)return (bps/1024).toFixed(1)+' KB/s'; return (bps/1048576).toFixed(2)+' MB/s';})(job.speed_bps);
      const dest = job.destination || 'auto';
      currentDest = dest;
      const retiredTarget = dest === 'onedrive';
      document.getElementById('meta').innerHTML =
        `<div>來源 <b>${esc(job.source_type)}</b> · 目標 <b>${esc(retiredTarget ? '舊目標（已停用）' : dest)}</b> · ${PB.badge(job.status)} · ${PB.progress(job.progress).toFixed(1)}% ${spd?' · '+spd:''}</div>
         <div class="muted" style="margin-top:6px">${esc(retiredTarget ? '保留原任務記錄，可重新搬運到 Google Drive。' : job.status_detail||'')}</div>
         <div style="word-break:break-all;margin-top:6px">${esc(job.share_url)}</div>
         <div class="muted">路徑前綴：${esc(job.pcloud_path||'')}</div>
         <div class="progress" role="progressbar" aria-label="任務進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${PB.progress(job.progress)}" style="margin-top:10px"><i style="width:${PB.progress(job.progress)}%"></i></div>`;
      document.getElementById('err').textContent = retiredTarget ? '' : job.error_message||'';
      const ja = document.getElementById('jobActions');
      let acts = retiredTarget ? '' : `<button type="button" class="secondary" onclick="openJobFolder()">在雲端開啟此任務資料夾</button>`;
      if (dest !== 'google') acts += ` <button onclick="document.getElementById('google-copy-confirm').hidden=false">重新搬運到 Google Drive</button>`;
      if (!retiredTarget && (job.status === 'failed' || job.status === 'cancelled')) {
        acts += ` <button type="button" class="secondary" onclick="retryJob()">重試</button>`;
      }
      if (['queued','resolving','saving','downloading','uploading'].includes(job.status)) {
        acts += ` <button type="button" class="secondary" onclick="controlJob('pause')">暫停</button>`;
        acts += ` <button type="button" class="secondary danger" onclick="cancelJob()">取消</button>`;
      }
      if (job.status === 'paused') acts += ` <button onclick="controlJob('resume')">繼續</button>`;
      acts += ` <button class="secondary danger" onclick="controlJob('delete')">刪除任務</button>`;
      PB.render(ja,acts);
      const counts=currentFiles.reduce((a,f)=>{a[f.status]=(a[f.status]||0)+1;return a;},{});
      document.getElementById('file-summary').textContent=`共 ${currentFiles.length} 個文件 · 已完成 ${counts.done||0} · 正在搬運 ${(counts.downloading||0)+(counts.uploading||0)} · 需要處理 ${counts.failed||0}`;
      renderFiles();
    }
    function matchingFiles(){const q=document.getElementById('filter-files').value.toLocaleLowerCase();const status=document.getElementById('filter-status').value;return currentFiles.filter(f=>(f.relative_path||f.remote_name||'').toLocaleLowerCase().includes(q)&&(!status||(status==='active'?['downloading','uploading'].includes(f.status):f.status===status)));}
    function renderFiles(){
      const dest=currentDest,retiredTarget=dest==='onedrive';
      const isLocal = dest === 'local';
      const matches=matchingFiles();const pages=Math.max(1,Math.ceil(matches.length/pageSize));page=Math.min(page,pages);
      document.getElementById('page-status').textContent=`搜尋結果 ${matches.length} 個 · 第 ${page}／${pages} 頁（每頁 ${pageSize} 個）`;
      document.getElementById('previous-page').disabled=page<=1;document.getElementById('next-page').disabled=page>=pages;
      const videoExt = /\.(mp4|mkv|webm|mov|m4v|avi|ts|m2ts|flv|wmv|mpg|mpeg|3gp|rmvb|rm|hevc|h265)$/i;
      const browserNativeExt = /\.(mp4|webm|mov|m4v)$/i;
      PB.render(document.getElementById('files'), matches.slice((page-1)*pageSize,page*pageSize).map(f => {
        let op = '';
        const name = f.relative_path||f.remote_name||'';
        if (!retiredTarget && videoExt.test(name) && f.status === 'done' && dest !== 'google') {
          const playLabel = browserNativeExt.test(name) ? '▶ 網頁試播' : '▶ 播放選項';
          op += `<a class="btn secondary" style="margin:2px" href="/play/${jobId}/${f.id}">${playLabel}</a>`;
          op += `<a class="btn" style="margin:2px" href="/api/tasks/${jobId}/files/${f.id}/open/infuse">Infuse</a>`;
          op += `<a class="btn secondary" style="margin:2px" href="/api/tasks/${jobId}/files/${f.id}/open/vlc">VLC</a>`;
          op += `<a class="btn secondary" style="margin:2px" href="/api/tasks/${jobId}/files/${f.id}/open/potplayer">PotPlayer</a>`;
        }
        if (!retiredTarget && f.status === 'done') {
          if (videoExt.test(name) && dest === 'google') op += `<button class="secondary" onclick="googlePlayback()">Infuse／VLC 播放說明</button>`;
          op += `<button type="button" class="secondary" style="margin:2px" onclick="openLocation(${jobId},${f.id})">在雲端顯示</button>`;
          if (isLocal) {
            op += `<a class="btn secondary" style="margin:2px" href="/api/tasks/${jobId}/files/${f.id}/download">下載</a>`;
          }
        }
        return `<tr>
          <td>${currentStatus==='awaiting_selection'?`<input type="checkbox" aria-label="選取文件：${esc(name)}" data-file-id="${f.id}" ${selectedIds.has(f.id)?'checked':''} onchange="toggleFile(${f.id},this.checked)" />`:''}${esc(name)}<div class="muted">${esc(retiredTarget ? '' : f.pcloud_path||'')}</div>
            ${!retiredTarget && f.error_message?`<div class="err">${esc(f.error_message)}</div>`:''}</td>
          <td>${fmt(f.size)}</td>
          <td>${fmt(f.downloaded_bytes)}${(f.status==='downloading'||f.status==='uploading')&&f.size?` <span class="muted">(${Math.min(100,(100*(f.downloaded_bytes||0)/f.size)).toFixed(1)}%)</span>`:''}</td>
          <td>${fmt(f.uploaded_bytes)}</td>
          <td>${PB.badge(f.status)}</td>
          <td>${op}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">'+(currentFiles.length?'沒有符合條件的文件':'解析中或尚無檔案…')+'</td></tr>');
      selectionSummary();
    }
    function googlePlayback(){PB.notice('Google 私人文件需要播放器登入你的 Google Drive。請從播放器或 Google Drive 電腦版開啟對應 PanBridge 文件；本站不公開文件，也不把憑證放進播放網址。');}
    function toggleFile(id, checked){if(checked) selectedIds.add(id); else selectedIds.delete(id);PB.invalidate(document.getElementById('files'));selectionSummary();}
    function selectionSummary(){const chosen=currentFiles.filter(f=>selectedIds.has(f.id)); document.getElementById('selection-summary').textContent='已選 '+chosen.length+' 個文件 · '+fmt(chosen.reduce((n,f)=>n+Number(f.size||0),0));}
    function filterFiles(){page=1;renderFiles();}
    function changePage(delta){page=Math.max(1,page+delta);renderFiles();}
    function selectVisible(checked){for(const f of matchingFiles()){if(checked)selectedIds.add(f.id);else selectedIds.delete(f.id);}renderFiles();}
    async function mutate(action){return PB.once('job',async()=>{acting=true;epoch++;document.querySelectorAll('#jobActions button,#start-selection,#google-copy-submit').forEach(el=>el.disabled=true);try{await action();}catch(e){PB.notice(e.message,'error');}finally{acting=false;epoch++;document.querySelectorAll('#jobActions button,#start-selection,#google-copy-submit').forEach(el=>el.disabled=false);await jobPoll.refresh();}});}
    async function confirmSelection(){if(!selectedIds.size){PB.notice('請至少選一個文件。','error');return;}const ids=[...selectedIds];await mutate(async()=>{await PB.request('/api/tasks/'+jobId+'/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file_ids:ids})});PB.notice('已提交選檔，雲端將依序搬運。','success');});}
    async function controlJob(action){
      if(action==='delete' && !await PB.confirmAction('移除任務並停止搬運？只清理本站記錄；已交付文件和未完成暫存保留。','確認刪除任務'))return;
      if(action==='cancel' && !await PB.confirmAction('取消此任務？已完成的雲端文件保留，未完成的搬運會停止。','確認取消搬運'))return;
      await mutate(async()=>{await PB.request('/api/tasks/'+jobId+(action==='delete'?'':'/'+action),{method:action==='delete'?'DELETE':'POST'});if(action==='delete'){location.href='/';return;}PB.notice(action==='pause'?'已暫停；已完成文件保留，可按繼續恢復。':action==='resume'?'已接續搬運。':'操作已完成。','success');});
    }
    async function copyToGoogle(){
      await mutate(async()=>{
        const d=await PB.request('/api/tasks/'+jobId+'/copy-to-google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({select_files:true})});
        if(!Number.isSafeInteger(d.job_id)||d.job_id<=0)throw new Error('尚未確認新任務編號，請刷新查看，不要連續提交。');
        location.href='/tasks/'+d.job_id;
      });
    }
    window.retryJob = async function(){
      await controlJob('retry');
    };
    window.cancelJob = async function(){
      await controlJob('cancel');
    };
    const jobPoll=PB.poll(load,{interval:3000,onSuccess:()=>{document.getElementById('refresh-status').textContent='已更新 · '+new Date().toLocaleTimeString()+' · 背景頁面暫停刷新';},onError:e=>{document.getElementById('refresh-status').textContent=e.message;}});
    Object.assign(window,{openLocation,openJobFolder,filterFiles,changePage,selectVisible,toggleFile,confirmSelection,controlJob,copyToGoogle,googlePlayback,jobPoll});
  </script>
</body>
</html>
